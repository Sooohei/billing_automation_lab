{% extends "base.html" %}
{% block title %}請求書一覧{% endblock %}
{% block head %}<script src="/static/htmx.min.js"></script>{% endblock %}
{% block content %}
  <h1>請求書一覧</h1>
  <form method="get" action="/invoices" class="filters">
    <label>受信日時 <input type="date" name="received_from" value="{{ filters.received_from }}"></label>
    〜
    <input type="date" name="received_to" value="{{ filters.received_to }}" aria-label="受信日時の終了日">
    <label>取引先
      <select name="partner_id">
        <option value="">すべて</option>
        {% for partner in partners %}
          <option value="{{ partner.id }}"{% if filters.partner_id == partner.id | string %} selected{% endif %}>{{ partner.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>申請状態
      <select name="status">
        <option value="">すべて</option>
        {% for value, label in status_labels.items() %}
          <option value="{{ value.value }}"{% if filters.status == value.value %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">絞り込む</button>
    <a href="/invoices">条件をクリア</a>
  </form>
  <table>
    <thead>
      <tr>
        <th>受信日時</th>
        <th>取引先</th>
        <th>税込金額</th>
        <th>支払期日</th>
        <th>申請状態</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="invoice-rows">
      {% include "invoices/_rows.html" %}
    </tbody>
  </table>
  {% if not rows %}<p>該当する請求書はありません。</p>{% endif %}
{% endblock %}

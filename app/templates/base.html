<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}請求書管理{% endblock %}</title>
  <style>
    body { font-family: sans-serif; margin: 0; color: #222; }
    header { display: flex; align-items: center; gap: 1.5rem; padding: 0.75rem 1.5rem; background: #2f4f6f; color: #fff; }
    header a { color: #fff; text-decoration: none; }
    header .user { margin-left: auto; font-size: 0.9rem; }
    main { padding: 1.5rem; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
    .errors { color: #b00020; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <nav>
      <a href="/invoices">請求書一覧</a>
      &nbsp;
      <a href="/partners">取引先管理</a>
    </nav>
    {% if current_user %}<span class="user">{{ current_user.email }}</span>{% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

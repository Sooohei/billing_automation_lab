<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}請求書管理{% endblock %} | 請求書管理</title>
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body>
  {% set path = request.url.path %}
  <header class="app-header">
    <a class="app-brand" href="/invoices"><span class="app-brand-mark">請</span>請求書管理</a>
    <nav class="app-nav">
      <a href="/invoices"{% if path.startswith("/invoices") %} class="active"{% endif %}>請求書一覧</a>
      <a href="/partners"{% if path.startswith("/partners") %} class="active"{% endif %}>取引先管理</a>
    </nav>
    {% if current_user %}
      <span class="app-user">
        <span class="app-user-avatar">{{ current_user.email[:1] }}</span>
        {{ current_user.email }}
      </span>
    {% endif %}
  </header>
  <main class="app-main{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: billing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 初回起動時に、テスト用の DB（billing_test）を作る
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
